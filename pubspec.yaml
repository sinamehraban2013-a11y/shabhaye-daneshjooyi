name: shabhaye_daneshjooyi
description: "اپلیکیشن شب‌های دانشجویی"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  open_file: ^3.3.2
  http: ^1.2.0
  path_provider: ^2.1.2
  syncfusion_flutter_pdfviewer: any
  url_launcher: ^6.2.4
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo-sh.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo-sh.png
