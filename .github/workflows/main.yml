name: Build shabha daneshjooyi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter build project
        run: |
          flutter create app_build \
            --org ir.shiravi \
            --project-name shabha_daneshjooyi \
            --platforms=android

      - name: Copy project files and logo
        run: |
          set -e

          # انتخاب pubspec نهایی در صورت وجود؛ در غیر این صورت فایل استاندارد
          if [ -f "pubspec.yaml" ]; then
            echo "Copying pubspec.yaml..."
            cp "pubspec.yaml" "app_build/pubspec.yaml"
          elif [ -f "pubspec.yaml" ]; then
            echo "Copying pubspec.yaml..."
            cp "pubspec.yaml" "app_build/pubspec.yaml"
          else
            echo "ERROR: No pubspec file found!"
            ls -la
            exit 1
          fi

          # انتخاب main نهایی در صورت وجود؛ در غیر این صورت فایل استاندارد
          if [ -f "main.dart" ]; then
            echo "Copying main.dart..."
            cp "main-(4).dart" "app_build/lib/main.dart"
          elif [ -f "lib/main.dart" ]; then
            echo "Copying lib/main.dart..."
            cp "lib/main.dart" "app_build/lib/main.dart"
          elif [ -f "main.dart" ]; then
            echo "Copying main.dart..."
            cp "main.dart" "app_build/lib/main.dart"
          else
            echo "ERROR: No main.dart file found!"
            find . -name "*.dart"
            exit 1
          fi

          # ساخت پوشهٔ assets و کپی لوگو
          mkdir -p app_build/assets

          if [ -f "assets/logo-sh.png" ]; then
            cp "assets/logo-sh.png" "app_build/assets/logo-sh.png"
          elif [ -f "shabhaye-daneshjooyi/assets/logo-sh.png" ]; then
            cp "shabhaye-daneshjooyi/assets/logo-sh.png" "app_build/assets/logo-sh.png"
          elif [ -f "logo-sh.png" ]; then
            cp "logo-sh.png" "app_build/assets/logo-sh.png"
          else
            echo "ERROR: logo-sh.png was not found!"
            find . -name "*.png"
            exit 1
          fi

      - name: Configure Android Manifest (Persian Name & Permissions)
        run: |
          set -e
          python3 - << 'EOF'
          import re

          path = "app_build/android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # تنظیم نام فارسی برنامه
          app_match = re.search(r"<application\b[^>]*>", content, flags=re.DOTALL)
          if not app_match:
              raise SystemExit("ERROR: <application> tag was not found in AndroidManifest.xml")

          app_tag = app_match.group(0)
          if 'android:label="' in app_tag:
              app_tag = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="شبهای دانشجویی"',
                  app_tag,
                  count=1
              )
          else:
              app_tag = app_tag[:-1] + ' android:label="شبهای دانشجویی">'

          content = content[:app_match.start()] + app_tag + content[app_match.end():]

          # مجوزهای موردنیاز برنامه
          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]

          missing_permissions = []
          for perm in permissions:
              if f'android:name="{perm}"' not in content:
                  missing_permissions.append(
                      f'    <uses-permission android:name="{perm}"/>'
                  )

          if missing_permissions:
              app_idx = re.search(r"<application\b", content)
              if not app_idx:
                  raise SystemExit("ERROR: <application> tag was not found.")

              permission_text = "\n".join(missing_permissions) + "\n"
              content = (
                  content[:app_idx.start()]
                  + permission_text
                  + content[app_idx.start():]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AndroidManifest.xml configured successfully.")
          EOF

      - name: Enable Core Library Desugaring
        run: |
          set -e
          python3 - << 'EOF'
          import re
          from pathlib import Path

          app_dir = Path("app_build/android/app")
          candidates = [
              app_dir / "build.gradle",
              app_dir / "build.gradle.kts",
          ]

          gradle_path = next((path for path in candidates if path.is_file()), None)

          if gradle_path is None:
              available = list(app_dir.glob("build.gradle*"))
              raise SystemExit(
                  "ERROR: Neither build.gradle nor build.gradle.kts was found. "
                  f"Files present: {available}"
              )

          is_kts = gradle_path.name.endswith(".kts")
          print(f"Updating {gradle_path}")

          content = gradle_path.read_text(encoding="utf-8")

          # فعال‌سازی desugaring در compileOptions
          compile_match = re.search(
              r"(?m)^([ \t]*)compileOptions\s*\{",
              content
          )

          if not compile_match:
              raise SystemExit(
                  f"ERROR: compileOptions block was not found in {gradle_path}"
              )

          enabled_pattern = r"\b(?:is)?coreLibraryDesugaringEnabled\b"
          if not re.search(enabled_pattern, content):
              indent = compile_match.group(1) + "    "
              setting = (
                  "isCoreLibraryDesugaringEnabled = true"
                  if is_kts
                  else "coreLibraryDesugaringEnabled true"
              )
              content = (
                  content[:compile_match.end()]
                  + "\n"
                  + indent
                  + setting
                  + content[compile_match.end():]
              )

          # افزودن کتابخانه؛ این بررسی مستقل از فعال‌سازی compileOptions است
          dependency_pattern = r"\bcoreLibraryDesugaring\s*(?:\(|['\"])"
          if not re.search(dependency_pattern, content):
              dependencies_match = re.search(
                  r"(?m)^([ \t]*)dependencies\s*\{",
                  content
              )

              if is_kts:
                  dependency_line = (
                      'coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")'
                  )
              else:
                  dependency_line = (
                      "coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'"
                  )

              if dependencies_match:
                  indent = dependencies_match.group(1) + "    "
                  content = (
                      content[:dependencies_match.end()]
                      + "\n"
                      + indent
                      + dependency_line
                      + content[dependencies_match.end():]
                  )
              else:
                  content += (
                      "\n\ndependencies {\n"
                      + "    "
                      + dependency_line
                      + "\n}\n"
                  )

          gradle_path.write_text(content, encoding="utf-8")
          print(f"Core Library Desugaring configured in {gradle_path}.")
          EOF

      - name: Generate Launcher Icons
        working-directory: app_build
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Android Release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shabha-daneshjooyi-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
