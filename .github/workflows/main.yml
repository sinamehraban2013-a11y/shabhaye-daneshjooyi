name: Build shabha daneshjooyi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter build project
        run: |
          flutter create app_build \
            --org ir.shiravi \
            --project-name shabha_daneshjooyi \
            --platforms=android

      - name: Copy project files and logo
        run: |
          set -e

          # ۱. کپی فایل pubspec.yaml از ریشه مخزن
          if [ -f "pubspec.yaml" ]; then
            echo "Copying pubspec.yaml from root..."
            cp "pubspec.yaml" "app_build/pubspec.yaml"
          else
            echo "ERROR: pubspec.yaml not found in root!"
            ls -la
            exit 1
          fi

          # ۲. کپی فایل main.dart از دایرکتوری lib
          if [ -f "lib/main.dart" ]; then
            echo "Copying main.dart from lib/..."
            cp "lib/main.dart" "app_build/lib/main.dart"
          elif [ -f "main.dart" ]; then
            echo "Copying main.dart from root..."
            cp "main.dart" "app_build/lib/main.dart"
          else
            echo "ERROR: main.dart not found in lib/ or root!"
            find . -name "*.dart"
            exit 1
          fi

          # ۳. ساخت پوشه assets و کپی لوگو
          mkdir -p app_build/assets

          if [ -f "assets/logo-sh.png" ]; then
            echo "Found logo at assets/logo-sh.png"
            cp "assets/logo-sh.png" "app_build/assets/logo-sh.png"
          elif [ -f "shabhaye-daneshjooyi/assets/logo-sh.png" ]; then
            echo "Found logo at shabhaye-daneshjooyi/assets/logo-sh.png"
            cp "shabhaye-daneshjooyi/assets/logo-sh.png" "app_build/assets/logo-sh.png"
          elif [ -f "logo-sh.png" ]; then
            echo "Found logo at logo-sh.png"
            cp "logo-sh.png" "app_build/assets/logo-sh.png"
          else
            echo "ERROR: logo-sh.png was not found anywhere!"
            find . -name "*.png"
            exit 1
          fi

      - name: Configure Android Manifest (Persian Name & Permissions)
        run: |
          set -e
          python3 - << 'EOF'
          import re

          path = "app_build/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # تنظیم نام فارسی «شبهای دانشجوی» زیر آیکون برنامه در گوشی
          app_match = re.search(r"<application\b[^>]*>", content, flags=re.DOTALL)
          if app_match:
              app_tag = app_match.group(0)
              if 'android:label="' in app_tag:
                  app_tag = re.sub(r'android:label="[^"]*"', 'android:label="شبهای دانشجوی"', app_tag, count=1)
              else:
                  app_tag = app_tag[:-1] + ' android:label="شبهای دانشجوی">'
              content = content[:app_match.start()] + app_tag + content[app_match.end():]

          # افزودن مجوزهای نوتیفیکیشن، ساعت ۱۷ و اینترنت
          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
          ]

          missing_permissions = []
          for perm in permissions:
              if f'android:name="{perm}"' not in content:
                  missing_permissions.append(f'    <uses-permission android:name="{perm}"/>')

          if missing_permissions:
              app_idx = re.search(r"<application\b", content)
              if app_idx:
                  perm_str = "\n".join(missing_permissions) + "\n"
                  content = content[:app_idx.start()] + perm_str + content[app_idx.start():]

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AndroidManifest.xml successfully configured with Persian label and permissions.")
          EOF

      - name: Generate Launcher Icons
        working-directory: app_build
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Android Release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shabha-daneshjooyi-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
