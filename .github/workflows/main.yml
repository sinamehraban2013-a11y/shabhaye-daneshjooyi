name: Build shabha daneshjooyi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          flutter create app_build \
            --org ir.shiravi \
            --project-name shabha_daneshjooyi \
            --platforms=android

      - name: Copy application files
        run: |
          set -e

      - name: Copy Flutter Code and Pubspec
        run: |
          set -e
          # کپی فایل pubspec اصلاح شده
          if [ -f "pubspec.yaml" ]; then
            cp "pubspec.yaml" "app_build/pubspec.yaml"
          else
            cp "pubspec.yaml" "app_build/pubspec.yaml"
          fi

          # کپی فایل کد دارت اصلی
          if [ -f "main.dart" ]; then
            cp "main.dart" "app_build/lib/main.dart"
          else
            cp "main.dart" "app_build/lib/main.dart"
          fi

          mkdir -p app_build/assets

          if [ -f "logo-sh.png" ]; then
            cp "logo-sh.png" "app_build/assets/logo-sh.png"
          elif [ -f "assets/logo-sh.png" ]; then
            cp "assets/logo-sh.png" "app_build/assets/logo-sh.png"
          elif [ -f "shabha_daneshjooyi/assets/logo-sh.png" ]; then
            cp "shabha_daneshjooyi/assets/logo-sh.png" "app_build/assets/logo-sh.png"
          else
            echo "logo-sh.png not found"
            exit 1
          fi

      - name: Configure Android Manifest (Persian Name & Permissions)
        run: |
          set -e
          MANIFEST="app_build/android/app/src/main/AndroidManifest.xml"
          
          # ۱. تنظیم نام فارسی برنامه زیر آیکون در گوشی
          sed -i 's/android:label="[^"]*"/android:label="شبهای دانشجوی"/g' "$MANIFEST"
          
          # ۲. افزودن مجوزهای لازم (اینترنت و یادآور روزانه)
          python3 - << 'EOF'
          import re
          path = "app_build/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          if "<uses-permission" not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1' + permissions, content, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF
          
      - name: Generate App Launcher Icons
        working-directory: app_build
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Android APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Install dependencies
        working-directory: app_build
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: app_build
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shabha-daneshjooyi-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
